name: generate animation

on:
  schedule:
    - cron: "0 */24 * * *" 

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            # Светлая тема (Light)
            dist/github-contribution-grid-snake.svg?color_snake=#e62e2d&color_dots=#f2f2f2,#febd31,#e62e2d,#8b1a1a,#1a1a1a
            # Тёмная тема (Dark)
            dist/github-contribution-grid-snake-dark.svg?color_snake=#febd31&color_dots=#1a1a1a,#4a0a0a,#8b1a1a,#e62e2d,#febd31
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
